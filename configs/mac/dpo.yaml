# LoRA + DPO on Apple silicon (MPS): bf16 base weights, fp32 LoRA params, no quantization.
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  device: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_file: data/mac/processed/train.jsonl
  test_file: data/mac/processed/test.jsonl

training:
  output_dir: outputs/qwen2.5-1.5b-safety-dpo
  beta: 0.1
  loss_type: sigmoid
  learning_rate: 5.0e-5          # LoRA needs a larger LR than full fine-tuning
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4 # effective batch 16
  max_length: 640
  max_prompt_length: 320
  gradient_checkpointing: true
  dataloader_pin_memory: false
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 25
  save_strategy: steps
  save_steps: 50
  save_total_limit: 1
  report_to: none
  seed: 42
