# LoRA + DPO on Llama-3-8B-Instruct, bf16, one 80GB GPU (A100/H100).
# For 24GB GPUs use configs/dpo_llama3_8b_qlora.yaml.
model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa        # flash_attention_2 if installed
  load_in_4bit: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_file: data/processed/train.jsonl
  test_file: data/processed/test.jsonl

# Passed to trl.DPOConfig; keys the installed TRL does not know are dropped with a warning.
training:
  output_dir: outputs/llama3-8b-safety-dpo
  beta: 0.1
  loss_type: sigmoid               # TRL>=1.0: [sigmoid, sft] + loss_weights [1.0, 0.2] = RPO-style NLL term
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch 32
  max_length: 1024
  max_prompt_length: 512           # TRL 0.x only
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  report_to: none                  # or wandb
  seed: 42
